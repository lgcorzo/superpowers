name: CI & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  shell-lint:
    name: Shell Scripts Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shell linter
        run: bash scripts/lint-shell.sh

  validate-package:
    name: Validate Package & Skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check package structure and skills
        run: |
          test -f package.json
          test -d skills
          echo "Validated skills directory: $(ls -1 skills | wc -l) skills present"
