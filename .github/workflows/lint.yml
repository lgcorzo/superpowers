name: Lint

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: bash scripts/lint-shell.sh

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            README.md
            docs/**/*.md
            skills/**/SKILL.md
        continue-on-error: true

  bash-expansion-guard:
    name: Bash 3.2 Compatibility Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Bash 4+ case-modification syntax
        run: |
          set -e
          matches=$(git grep -En '\$\{[a-zA-Z_0-9]+[\^\,]{1,2}\}' -- 'scripts/**/*.sh' 'hooks/**/*.sh' || true)
          if [ -n "$matches" ]; then
            echo "Found bash 4+ case-modification expansion(s); use tr for portability (macOS ships bash 3.2):"
            echo "$matches"
            exit 1
          fi
          echo "Portability check passed."
